name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # mirror the separation model in this repo so the app can download it from here
      - name: Model mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models
          if ! gh release view model >/dev/null 2>&1; then
            gh release create model --prerelease --title "نماذج العزل" --notes "نماذج UVR MDX-Net. التطبيق يحمّلها تلقائيًا أول مرة."
          fi
          have=$(gh release view model --json assets -q '.assets[].name')
          for f in UVR_MDXNET_1_9703.onnx Kim_Vocal_2.onnx; do
            if ! grep -qx "$f" <<< "$have"; then
              curl -fsSL -o "$f" "$base/$f" && gh release upload model "$f"
            fi
          done

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "azl-v1.0.${{ github.run_number }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: عزل 1.0.${{ github.run_number }}
          make_latest: true
          files: azl-v1.0.${{ github.run_number }}.apk
          body: |
            نزّل ملف **azl-v1.0.${{ github.run_number }}.apk** تحت، وافتحه في جوالك عشان تثبّته.
            أول مرة تعزل فيها، التطبيق يحمّل نموذج العزل (30 ميقا) مرة وحدة بس.
